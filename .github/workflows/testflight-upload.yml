name: TestFlight signed upload
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 40
    environment: testflight
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.APPLE_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required settings
        shell: bash
        run: |
          set -euo pipefail
          for name in TEAM_ID BUNDLE_ID CERTIFICATE_B64 CERTIFICATE_PASSWORD PROFILE_B64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_B64; do
            if [[ -z "${!name}" ]]; then echo "Missing setting: $name"; exit 1; fi
          done
      - name: Compile before signing
        run: bash scripts/testflight.sh --verify
      - name: Install signing assets in temporary keychain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import plistlib, os, pathlib, shutil
          p = plistlib.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'profile.plist').read_bytes())
          assert os.environ['TEAM_ID'] in p['TeamIdentifier'], 'Profile team mismatch'
          assert p['Entitlements']['application-identifier'].endswith('.' + os.environ['BUNDLE_ID']), 'Profile app mismatch'
          assert not p.get('ProvisionedDevices') and not p.get('ProvisionsAllDevices'), 'Use App Store distribution profile'
          assert not p['Entitlements'].get('get-task-allow', False), 'Development profile cannot be used'
          destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copy(pathlib.Path(os.environ['RUNNER_TEMP'], 'profile.mobileprovision'), destination / (p['UUID'] + '.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PROFILE_UUID=' + p['UUID'] + '\n')
          options = {'method':'app-store-connect', 'destination':'upload', 'teamID':os.environ['TEAM_ID'], 'signingStyle':'manual', 'signingCertificate':'Apple Distribution', 'provisioningProfiles':{os.environ['BUNDLE_ID']:p['UUID']}, 'uploadSymbols':True, 'manageAppVersionAndBuildNumber':False}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          keychain_path="$RUNNER_TEMP/mark-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
      - name: Archive and upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          xcodebuild -project MarkMobile.xcodeproj -scheme MarkMobile \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MarkMobile.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$build_number" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MarkMobile.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove signing assets
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mark-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
